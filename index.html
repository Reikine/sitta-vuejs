<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Daftar - SITTA</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/toast.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="js/auth-app.js" type="module" defer></script>
</head>

<body>
  <main id="app-auth" v-cloak>

    <div class="toast-container">
      <transition-group name="toast">
        <div v-for="toast in toasts" :key="toast.id" :class="['toast-item', toast.type]" @click="removeToast(toast.id)">
          <span>{{ toast.message }}</span>
          <span class="toast-close-btn">&times;</span>
        </div>
      </transition-group>
    </div>

    <div id="loginBox" v-show="currentView === 'login'">
      <div class="auth-box-header">
        <img src="assets/logo-ut.png" alt="Logo UT" class="auth-logo">
        <h2>Login</h2>
      </div>

      <form @submit.prevent="handleLogin">
        <div class="form-group">
          <label>Email</label>
          <input type="email" v-model="loginForm.email" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-container">
            <input :type="showPassword ? 'text' : 'password'" v-model="loginForm.password"
              autocomplete="current-password" required />
            <button type="button" @click="togglePassword" class="password-toggle-btn" title="Tampilkan Password">
              <span class="material-symbols-outlined">
                {{ showPassword ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-full">Masuk</button>
      </form>

      <div class="login-nav">
        <p>
          <a href="#" @click.prevent="openResetModal">Lupa Password</a>
        </p>
        <p>
          Belum punya akun?
          <a href="#" @click.prevent="currentView = 'register'">Daftar di sini</a>
        </p>
      </div>
    </div>

    <div id="regBox" v-show="currentView === 'register'">
      <div class="auth-box-header">
        <img src="assets/logo-ut.png" class="auth-logo">
        <h2>Daftar Akun Baru</h2>
      </div>

      <form @submit.prevent="handleRegister">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" v-model="regForm.name" required />
        </div>

        <div class="form-group">
          <label>Email Baru</label>
          <input type="email" v-model="regForm.email" required />
        </div>

        <div class="form-group">
          <label>Password Baru</label>
          <input type="password" v-model="regForm.password" autocomplete="new-password" required />
        </div>

        <div class="form-group">
          <label>Lokasi</label>
          <input type="text" v-model="regForm.location" placeholder="Contoh: UPBJJ Jakarta / Pusat" required />
        </div>

        <button type="submit" class="btn-primary btn-full">Daftar Sekarang</button>
      </form>

      <div class="login-nav">
        <p>
          Sudah punya akun?
          <a href="#" @click.prevent="currentView = 'login'">Kembali ke Login</a>
        </p>
      </div>
    </div>

    <div class="modal-overlay" v-if="isResetModalOpen">
      <div class="modal-content">
        <h3>Reset Password</h3>
        <p>Masukkan email akun Anda yang terdaftar untuk mengirim permintaan ke admin.</p>

        <form @submit.prevent="submitForgotPassword">
          <div class="modal-input-group">
            <input type="email" v-model="resetEmail" placeholder="Contoh: user@ut.ac.id" required autofocus />
          </div>

          <div id="modalActionArea">
            <button type="submit" class="btn-primary">Kirim</button>
            <button type="button" @click="closeResetModal" class="btn-secondary">Batal</button>
          </div>
        </form>
      </div>
    </div>

  </main>
</body>

</html>
